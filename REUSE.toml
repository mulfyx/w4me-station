version = 1
SPDX-PackageName = "W4ME Station"
SPDX-PackageSupplier = "W4ME Station contributors"
SPDX-PackageDownloadLocation = "https://github.com/mulfyx/w4me-station"

[[annotations]]
path = [
  ".claude/**",
  ".codex/**",
  ".dockerignore",
  ".editorconfig",
  ".editorconfig-checker.json",
  ".gitattributes",
  ".gitleaksignore",
  ".gitleaks.toml",
  ".github/**",
  ".gitignore",
  ".hadolint.yaml",
  ".markdownlint-cli2.jsonc",
  ".prettierignore",
  ".prettierrc.json",
  ".vale.ini",
  ".yamllint.yml",
  "AGENTS.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "_typos.toml",
  "bench/**",
  "cartridges/README.md",
  "commitlint.config.mjs",
  "config/**",
  "docs/*.md",
  "docs/media/README.md",
  "docs/media/hero-phone.jpg",
  "justfile",
  "lychee.toml",
  "openspec/**",
  "package-lock.json",
  "package.json",
  "pom.xml",
  "pyproject.toml",
  "renovate.json5",
  "src/main/java/**",
  "src/main/manifest/**",
  "src/main/resources/icon.png",
  "src/test/**",
  "testdata/**",
  "tools/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 W4ME Station contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "dist/SHA256SUMS",
  "dist/w4me-station-base.jad",
  "dist/w4me-station.jad"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 W4ME Station contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "dist/w4me-station-base.jar",
  "dist/w4me-station.jar"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "W4ME Station contributors and bundled cartridge authors"
SPDX-License-Identifier = "MIT AND ISC AND BSD-2-Clause AND CC-BY-NC-SA-4.0"

