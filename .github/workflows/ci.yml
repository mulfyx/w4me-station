---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Strict build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build project toolchain
        # docker/build-push-action v7
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: tools/container/Containerfile
          load: true
          tags: localhost/w4me-station:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run strict Java analysis
        run: ./tools/analysis.sh

      - name: Run security and supply-chain gates
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMITLINT_TO: ${{ github.sha }}
        run: ./tools/security.sh

      - name: Test and build release artifacts
        run: ./tools/release.sh

      - name: Verify checked-in release artifacts
        run: git diff --exit-code -- dist
