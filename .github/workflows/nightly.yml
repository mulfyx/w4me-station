---
name: Nightly quality

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Deep quality and supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build project toolchain
        # docker/build-push-action v7
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: tools/container/Containerfile
          load: true
          tags: localhost/w4me-station:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run nightly release and supply-chain audit
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/nightly.sh

      - name: Upload audit reports
        if: always()
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nightly-quality-reports
          path: build/reports
          if-no-files-found: error
          retention-days: 14
